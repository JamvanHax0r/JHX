<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#05060a;color:#e6e8ee;font-family:'Space Grotesk',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center}
img{width:88px;height:88px;border-radius:20px;margin-bottom:24px;border:1px solid rgba(255,255,255,.08)}
h1{font-size:22px;font-weight:700;color:#fff;margin:0 0 10px}
p{font-family:'JetBrains Mono',monospace;font-size:12px;color:#64748b;margin:0 0 24px;max-width:300px;line-height:1.6}
button{background:linear-gradient(90deg,#F59E0B,#22d3ee);color:#05060a;border:0;padding:14px 32px;border-radius:12px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 0 30px rgba(245,158,11,.3)}
button:active{transform:scale(.96)}
</style>
</head>
<body>
<img src="https://jhx.my.id/logo.jpeg" onerror="this.style.display='none'">
<h1>Koneksi Terputus</h1>
<p>Pastikan koneksi internet aktif untuk menggunakan JH-Tools secara penuh.</p>
<button onclick="location.replace('https://jhx.my.id/')">↺ COBA LAGI</button>
</body></html>
