<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline — JH-Tools</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#05060a; color:#e2e8f0; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono',ui-monospace,monospace; overflow:hidden;
  }
  .glow {
    position:fixed; width:340px; height:340px; border-radius:50%;
    background:radial-gradient(circle, rgba(245,158,11,.14), rgba(139,92,246,.10) 45%, transparent 70%);
    top:50%; left:50%; transform:translate(-50%,-50%);
    animation:pulse 3s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(1)} 50%{opacity:1;transform:translate(-50%,-50%) scale(1.15)} }
  .card {
    position:relative; text-align:center; padding:40px 32px; border-radius:24px;
    background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(12px); max-width:320px; width:88%;
  }
  .icon { font-size:56px; margin-bottom:20px; filter:grayscale(20%); }
  h1 {
    font-size:22px; letter-spacing:.12em; margin-bottom:10px;
    background:linear-gradient(90deg,#F59E0B,#8B5CF6,#22D3EE);
    -webkit-background-clip:text; background-clip:text; color:transparent; font-weight:800;
  }
  p { font-size:12px; color:#64748b; line-height:1.7; margin-bottom:28px; }
  a.btn {
    display:inline-block; padding:12px 36px; border-radius:12px; text-decoration:none;
    font-size:12px; font-weight:700; letter-spacing:.2em; color:#05060a;
    background:linear-gradient(90deg,#F59E0B,#22D3EE);
    box-shadow:0 4px 24px rgba(245,158,11,.35);
  }
  a.btn:active { transform:scale(.96); }
  .foot { margin-top:24px; font-size:9px; color:#334155; letter-spacing:.3em; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="card">
    <div class="icon">📡</div>
    <h1>KAMU OFFLINE</h1>
    <p>Koneksi internet tidak terdeteksi.<br>Pastikan paket data / WiFi aktif, lalu coba lagi.</p>
    <a class="btn" href="https://jhx.my.id/">COBA LAGI</a>
    <div class="foot">JHX.MY.ID</div>
  </div>
</body>
</html>
