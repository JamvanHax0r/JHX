name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ['android/**', '.github/workflows/apk.yml', 'jhtools.keystore']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install platforms
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Prepare keystore and icon
        run: |
          ls -la
          if [ -f jhtools.keystore ]; then cp jhtools.keystore android/jhtools.keystore; fi
          if [ ! -f android/jhtools.keystore ]; then echo "KEYSTORE MISSING"; exit 1; fi
          mkdir -p android/app/src/main/res/drawable
          if [ ! -s android/app/src/main/res/drawable/ic_launcher.jpg ] && [ ! -s android/app/src/main/res/drawable/ic_launcher.png ]; then
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > android/app/src/main/res/drawable/ic_launcher.png
          fi
          ls -la android android/app/src/main/res/drawable
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
          cache-disabled: true
      - name: Build
        run: cd android && gradle assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: JHTools-APK
          path: android/app/build/outputs/apk/release/app-release.apk
